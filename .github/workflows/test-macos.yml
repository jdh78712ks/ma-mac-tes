name: Test MA Launcher on macOS M1 (ARM64)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Прямая ссылка на zip (оставьте пустым — скачается из Releases репозитория)"
        required: false
        default: ""
      keep_alive_minutes:
        description: "Сколько минут держать рабочий стол Mac M1 в браузере (30 FPS)"
        required: false
        default: "30"
      runs_on:
        description: "Лейбл раннера (macos-14 / macos-15 / macos-26)"
        required: false
        default: "macos-15"

jobs:
  macos-m1-test:
    name: Apple M1 (ARM64) 30 FPS Live Desktop
    runs-on: ${{ inputs.runs_on || 'macos-15' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Настройка пароля macOS и проверка архитектуры (Apple Silicon ARM64)
        run: |
          echo "=== Настройка пароля администратора для runner ==="
          sudo dscl . -passwd /Users/runner ma123456 2>/dev/null || true
          echo -e "ma123456\nma123456" | sudo passwd runner 2>/dev/null || true
          echo "✅ Пароль администратора macOS установлен: ma123456 (пользователь: runner)"
          echo "=== Информация о системе ==="
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string

      - name: 2. Скачивание и установка M&A-Setup-macOS.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set +e
          mkdir -p /tmp/ma_installer /tmp/ma_screenshots
          cd /tmp/ma_installer

          if [ -n "$ZIP_URL" ]; then
            echo "Скачивание по прямой ссылке..."
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "$ZIP_URL"
          else
            echo "Скачивание zip архива из Releases репозитория ${GITHUB_REPOSITORY}..."
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "/tmp/ma_installer" --clobber || \
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/M%26A-Setup-macOS.zip" || \
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/M.A-Setup-macOS.zip"
          fi

          # Находим скачанный zip архив
          ZIP_FOUND=$(find /tmp/ma_installer -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FOUND" ] && [ -f "$ZIP_FOUND" ]; then
            echo "Найден архив: $ZIP_FOUND ($(ls -lh "$ZIP_FOUND" | awk '{print $5}'))"
            echo "Распаковка через ditto..."
            /usr/bin/ditto -x -k "$ZIP_FOUND" "/tmp/ma_installer/extracted"

            SETUP_APP=$(find /tmp/ma_installer/extracted -name "M&A-Setup.app" | head -n 1)
            if [ -n "$SETUP_APP" ]; then
              chmod +x "$SETUP_APP/Contents/MacOS/M&A-Setup"
              xattr -cr "$SETUP_APP" 2>/dev/null
              echo "Запуск графического инсталлятора M&A-Setup..."
              "$SETUP_APP/Contents/MacOS/M&A-Setup"
            else
              echo "M&A-Setup.app не найден, проверка наличия распакованных файлов..."
            fi

            echo "=== Проверка установленных файлов в /Applications/M&A Antidetect ==="
            ls -la "/Applications/M&A Antidetect" 2>/dev/null || true
            ls -la "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS" 2>/dev/null || true
            ls -la "/Applications/M&A Antidetect/MA DATA/runtime" 2>/dev/null || true

            echo "Настройка прав TCC Accessibility и подпись всех бинарников..."
            sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher-core',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/MA DATA/runtime/python/bin/python3',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/MA DATA/runtime/python/bin/python3.11',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/ShardX',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/ShardX_core',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);
               INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.Terminal',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1677721600);" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/libshardx_hook.dylib" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/libmac_win_helper.dylib" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/libshardx_hook.dylib" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/ShardX_core" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/ShardX" 2>/dev/null || true
            /usr/bin/codesign --force --deep --sign - "/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/python/bin/python3" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/MA DATA/runtime/python/bin/python3.11" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher-core" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher" 2>/dev/null || true
            /usr/bin/codesign --force --deep --sign - "/Applications/M&A Antidetect/M&A Launcher.app" 2>/dev/null || true
            /usr/bin/xattr -cr "/Applications/M&A Antidetect" 2>/dev/null || true
            open "/Applications/M&A Antidetect/M&A Launcher.app" || open "/Applications/M&A Launcher.app"
            sleep 6
            ps aux | grep -iE "shardx|M&A|launcher"
            if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              for f in "$HOME/Library/Logs/DiagnosticReports"/*; do
                if [ -f "$f" ]; then
                  echo "--- Crash report: $f ---"
                  head -n 45 "$f"
                fi
              done
            fi
          else
            echo "ОШИБКА: Архив с дистрибутивом не найден в Releases!"
            echo "Пожалуйста, загрузите M&A-Setup-macOS.zip в раздел Releases репозитория."
            exit 1
          fi
          exit 0

      - name: 2b. Проба движка ShardX на этой macOS (без лаунчера)
        run: |
          set +e
          OUT=/tmp/ma_probe
          mkdir -p $OUT
          RT="/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64"
          echo "os=$(sw_vers -productVersion) build=$(sw_vers -buildVersion) arch=$(uname -m)" | tee $OUT/os.txt
          ls "$RT" | tee $OUT/runtime_ls.txt
          md5 -q "$RT/ShardX" | tee $OUT/wrapper_md5.txt
          ls -la "$(dirname "$RT")" | tee $OUT/runtime_dir_ls.txt
          echo "hook_loose_size=$(stat -f %z "$(dirname "$RT")/libshardx_hook.dylib" 2>/dev/null)" | tee $OUT/hook_loose_size.txt
          md5 -q "$(dirname "$RT")/libshardx_hook.dylib" 2>/dev/null | tee $OUT/hook_loose_md5.txt
          echo "hook_app_size=$(stat -f %z "$RT/ShardX.app/Contents/MacOS/libshardx_hook.dylib" 2>/dev/null)" | tee $OUT/hook_app_size.txt
          md5 -q "$RT/ShardX.app/Contents/MacOS/libshardx_hook.dylib" | tee $OUT/hook_app_md5.txt
          strings -a "$RT/ShardX" | grep -c "is not supported: the bundled Chromium" | tee $OUT/gate_literal.txt
          cat > /tmp/wl.swift <<'SW'
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1])!
          if let arr = CGWindowListCopyWindowInfo(CGWindowListOption(arrayLiteral: .excludeDesktopElements), kCGNullWindowID) as? [[String: Any]] {
              var n = 0
              for w in arr {
                  if (w[kCGWindowOwnerPID as String] as? Int32) != pid { continue }
                  n += 1
                  let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
                  print("WIN \(n) \(b["Width"] ?? 0)x\(b["Height"] ?? 0) onscreen=\(w[kCGWindowIsOnscreen as String] ?? "nil")")
              }
              if n == 0 { print("WIN none") }
          }
          SW
          swiftc -O /tmp/wl.swift -o /tmp/wl 2>$OUT/swiftc.log || echo "swiftc failed" | tee $OUT/swiftc_fail.txt
          pkill -f ShardX_core 2>/dev/null
          rm -rf /tmp/ma_probe_udd
          "$RT/ShardX" --user-data-dir=/tmp/ma_probe_udd --no-first-run --no-default-browser-check --window-size=534,969 --remote-debugging-port=9920 about:blank >$OUT/wrapper.log 2>&1 &
          WPID=$!
          sleep 12
          echo "wrapper_alive=$(kill -0 $WPID 2>/dev/null && echo yes || echo no)" | tee $OUT/alive.txt
          CP=$(pgrep -x ShardX_core | head -1)
          echo "core_pid=$CP" | tee $OUT/pid.txt
          ps -p $CP -o pid,%cpu,rss,etime,comm 2>/dev/null | tee $OUT/ps.txt
          if [ -n "$CP" ]; then /tmp/wl $CP | tee $OUT/windows.txt; else echo "WIN no-core" | tee $OUT/windows.txt; fi
          curl -s -m 5 http://127.0.0.1:9920/json/version | tee $OUT/cdp.txt
          echo | tee -a $OUT/cdp.txt
          curl -s -m 5 http://127.0.0.1:9920/json/list | tail -c 1200 | tee $OUT/targets.txt
          screencapture -x $OUT/after_launch.png 2>/dev/null
          ls -la $OUT/after_launch.png | tee $OUT/shot.txt
          echo "--- launch_error ---" | tee $OUT/launch_error.txt
          cat /tmp/ma_probe_udd/launch_error.txt 2>/dev/null | tee -a $OUT/launch_error.txt
          echo "--- summary ---"
          for f in os.txt wrapper_md5.txt hook_loose_size.txt hook_loose_md5.txt hook_app_size.txt hook_app_md5.txt gate_literal.txt alive.txt pid.txt ps.txt windows.txt cdp.txt; do
            echo "== $f =="; cat $OUT/$f; echo
          done
          echo "=== phase 2: window gate (25s) ==="
          pkill -f ShardX_core 2>/dev/null
          rm -rf /tmp/ma_probe_udd2
          mkdir -p /tmp/ma_probe_udd2
          "$RT/ShardX" --user-data-dir=/tmp/ma_probe_udd2 --no-first-run --no-default-browser-check --window-size=534,969 about:blank >$OUT/gate_wrapper.log 2>&1 &
          GPID=$!
          sleep 34
          echo "gate_wrapper_alive=$(kill -0 $GPID 2>/dev/null && echo yes || echo no)" > $OUT/gate_state.txt
          echo "core_after=$(pgrep -x ShardX_core | wc -l | tr -d ' ')" >> $OUT/gate_state.txt
          cp /tmp/ma_probe_udd2/launch_error.txt $OUT/gate_launch_error.txt 2>/dev/null || echo "(no launch_error.txt)" > $OUT/gate_launch_error.txt
          screencapture -x $OUT/after_gate.png 2>/dev/null
          for i in $(seq 1 20); do kill -0 $GPID 2>/dev/null || break; sleep 1; done
          echo "gate_wrapper_alive_late=$(kill -0 $GPID 2>/dev/null && echo yes || echo no)" >> $OUT/gate_state.txt
          kill -9 $GPID 2>/dev/null
          cat $OUT/gate_state.txt
          echo "--- gate launch_error ---"
          cat $OUT/gate_launch_error.txt
          echo "--- gate wrapper log ---"
          tail -c 1200 $OUT/gate_wrapper.log
          pkill -f ShardX_core 2>/dev/null
          exit 0


      - name: 2c. Свип вариантов запуска движка (изоляция свитчей патча)
        run: |
          set +e
          OUT=/tmp/ma_probe
          mkdir -p $OUT
          RT="/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64"
          CORE="$RT/ShardX.app/Contents/MacOS/ShardX_core"
          FP=$(find "/Applications/M&A Antidetect/MA DATA/user-data" -maxdepth 2 -name fingerprint.json 2>/dev/null | head -1)
          echo "os=$(sw_vers -productVersion) build=$(sw_vers -buildVersion) arch=$(uname -m)" | tee $OUT/sweep_os.txt
          echo "core_exists=$([ -x "$CORE" ] && echo yes || echo no) fp=$FP" | tee $OUT/sweep_meta.txt

          if [ ! -x /tmp/wl ]; then
            cat > /tmp/wl.swift <<'SW'
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1])!
          if let arr = CGWindowListCopyWindowInfo(CGWindowListOption(arrayLiteral: .excludeDesktopElements), kCGNullWindowID) as? [[String: Any]] {
              var n = 0
              for w in arr {
                  if (w[kCGWindowOwnerPID as String] as? Int32) != pid { continue }
                  n += 1
                  let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
                  print("WIN \(n) \(b["Width"] ?? 0)x\(b["Height"] ?? 0) onscreen=\(w[kCGWindowIsOnscreen as String] ?? "nil")")
              }
              if n == 0 { print("WIN none") }
          }
          SW
            swiftc -O /tmp/wl.swift -o /tmp/wl 2>$OUT/swiftc2.log
          fi

          cat > /tmp/disp.swift <<'SW'
          import CoreGraphics
          import CoreVideo
          import Foundation
          let d = CGMainDisplayID()
          let b = CGDisplayBounds(d)
          var link: CVDisplayLink?
          CVDisplayLinkCreateWithCGDisplay(d, &link)
          var rate: Double = -1
          if let l = link { rate = CVDisplayLinkGetNominalRefreshRate(l) }
          print("display \(Int(b.width))x\(Int(b.height)) px=\(CGDisplayPixelsWide(d))x\(CGDisplayPixelsHigh(d)) refresh_hz=\(rate)")
          SW
          swiftc -O /tmp/disp.swift -o /tmp/disp 2>$OUT/disp_swiftc.log && /tmp/disp | tee $OUT/display.txt || echo "display probe failed" | tee $OUT/display.txt

          : > $OUT/sweep.tsv
          sweep() {
            local name=$1; local port=$2; shift 2
            local ud=/tmp/sweep_$name
            rm -rf $ud; mkdir -p $ud
            "$CORE" --user-data-dir=$ud --no-first-run --no-default-browser-check --window-size=534,969 --remote-debugging-port=$port "$@" about:blank >$OUT/sweep_$name.log 2>&1 &
            sleep 10
            local CP=$(pgrep -x ShardX_core | head -1)
            local cpu=$(ps -p ${CP:-0} -o %cpu= 2>/dev/null | tr -d ' ')
            local win
            if [ -n "$CP" ] && [ -x /tmp/wl ]; then win=$(/tmp/wl $CP 2>/dev/null | tr '\n' ';'); else win="(no core)"; fi
            local cdp=$(curl -s -m 3 http://127.0.0.1:$port/json/version | head -c 60)
            local shard=$(grep -c "ShardXBrowser:" $OUT/sweep_$name.log 2>/dev/null)
            printf "%s\tcpu=%s\twin=%s\tcdp=%s\tshard_lines=%s\n" "$name" "${cpu:-?}" "${win:-none}" "${cdp:-none}" "${shard:-0}" | tee -a $OUT/sweep.tsv
            echo "--- $name ---" >> $OUT/sweep_shard.txt
            grep "ShardXBrowser:" $OUT/sweep_$name.log 2>/dev/null | sed 's/.*ShardXBrowser:/  ShardXBrowser:/' | sort -u | head -8 >> $OUT/sweep_shard.txt
            pkill -9 -f "user-data-dir=$ud" 2>/dev/null
            pkill -9 -x ShardX_core 2>/dev/null
            sleep 2
          }

          echo "=== sweep start ===" | tee $OUT/sweep_shard.txt
          P=9931
          sweep bare        $P
          sweep realscreen  $((P+1))  --shardx-real-screen
          sweep nospoof     $((P+2))  --disable-spoofing
          sweep nospoof2    $((P+3))  --shardx-disable-spoofing
          sweep both        $((P+4))  --shardx-real-screen --disable-spoofing --shardx-disable-spoofing
          if [ -n "$FP" ]; then
            sweep fp         $((P+5)) --fingerprint-profile="$FP"
            sweep fp_nospoof $((P+6)) --fingerprint-profile="$FP" --disable-spoofing --shardx-real-screen
          else
            echo "fp variants skipped (no fingerprint.json found)" | tee -a $OUT/sweep.tsv
          fi
          if [ -d "/Applications/Google Chrome.app" ]; then
            UD=/tmp/sweep_chrome; rm -rf $UD; mkdir -p $UD
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --user-data-dir=$UD --no-first-run --window-size=534,969 about:blank >/tmp/chrome_ctrl.log 2>&1 &
            sleep 10
            CP=$(pgrep -f "user-data-dir=$UD" | head -1)
            echo "chrome_control	cpu=$(ps -p ${CP:-0} -o %cpu= | tr -d ' ')	win=$(/tmp/wl ${CP:-0} 2>/dev/null | tr '\n' ';')" | tee -a $OUT/sweep.tsv
            pkill -9 -f "user-data-dir=$UD" 2>/dev/null
          else
            echo "chrome_control	not installed" | tee -a $OUT/sweep.tsv
          fi
          echo "=== sweep done ===" | tee -a $OUT/sweep_shard.txt
          cat $OUT/sweep.tsv
          echo "--- tail of bare log ---"
          tail -c 1500 $OUT/sweep_bare.log
          pkill -9 -x ShardX_core 2>/dev/null
          exit 0

      - name: 2d. Гонка pristine CDN-движка против нашего payload (симлинки и сборка)
        run: |
          set +e
          OUT=/tmp/ma_probe
          mkdir -p $OUT
          CDNDIR=/tmp/cdn_engine
          rm -rf $CDNDIR; mkdir -p $CDNDIR
          curl -sL --fail -o /tmp/cdn_mac.zip "https://pub-e57a7c60f6934eb09a6600bf2fc59cdc.r2.dev/ShardX-Mac-arm64.zip"
          echo "cdn_zip_size=$(stat -f %z /tmp/cdn_mac.zip 2>/dev/null)" | tee $OUT/cdn_zip.txt
          /usr/bin/ditto -x -k /tmp/cdn_mac.zip $CDNDIR
          APP=$(find $CDNDIR -maxdepth 4 -name "ShardX.app" -type d | head -1)
          echo "cdn_app=$APP" | tee $OUT/cdn_app.txt
          FWR="$APP/Contents/Frameworks/ShardX Framework.framework"
          ls -la "$FWR" | tee $OUT/cdn_fw_root.txt
          md5 -q "$FWR/Versions/156.0.8078.48/ShardX Framework" | tee $OUT/cdn_fw_md5.txt
          md5 -q "/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/Frameworks/ShardX Framework.framework/Versions/156.0.8078.48/ShardX Framework" | tee $OUT/our_fw_md5.txt

          [ -x /tmp/wl ] || echo "wl missing"
          : > $OUT/race.tsv

          race() {
            local name=$1; local bin=$2; local port=$3
            local ud=/tmp/race_$name
            rm -rf $ud; mkdir -p $ud
            "$bin" --user-data-dir=$ud --no-first-run --no-default-browser-check --window-size=534,969 --remote-debugging-port=$port about:blank >$OUT/race_$name.log 2>&1 &
            local p=$!
            sleep 11
            local alive=no; kill -0 $p 2>/dev/null && alive=yes
            local cpu=$(ps -p $p -o %cpu= 2>/dev/null | tr -d ' ')
            local st=$(ps -p $p -o state= 2>/dev/null | tr -d ' ')
            local win
            if [ -x /tmp/wl ]; then win=$(/tmp/wl $p 2>/dev/null | tr '\n' ';'); else win="?"; fi
            local cdp=$(curl -s -m 3 http://127.0.0.1:$port/json/version | head -c 60)
            printf "%s\talive=%s\tstate=%s\tcpu=%s\twin=%s\tcdp=%s\n" "$name" "$alive" "${st:-?}" "${cpu:-?}" "${win:-none}" "${cdp:-none}" | tee -a $OUT/race.tsv
            pkill -9 -f "user-data-dir=$ud" 2>/dev/null
            sleep 2
          }

          if [ -n "$APP" ]; then
            race cdn_pristine "$APP/Contents/MacOS/ShardX" 9951
            # симплуляция нашей упаковки: 5 симлинков -> файлы с текстом пути
            APP2=/tmp/cdn_flatten/ShardX-Mac-arm64
            rm -rf /tmp/cdn_flatten; mkdir -p /tmp/cdn_flatten
            /usr/bin/ditto -x -k /tmp/cdn_mac.zip /tmp/cdn_flatten
            CDNAPP=$(find /tmp/cdn_flatten -maxdepth 4 -name "ShardX.app" -type d | head -1)
            python3 - "$CDNAPP" <<'PY'
          import os, sys
          base = os.path.join(sys.argv[1], "Contents", "Frameworks", "ShardX Framework.framework")
          links = {
              "Helpers": "Versions/Current/Helpers",
              "Libraries": "Versions/Current/Libraries",
              "Resources": "Versions/Current/Resources",
              "ShardX Framework": "Versions/Current/ShardX Framework",
          }
          for name, target in links.items():
              p = os.path.join(base, name)
              if os.path.islink(p) or os.path.isfile(p):
                  os.remove(p)
                  open(p, "w").write(target)
                  print("flattened", name)
          cur = os.path.join(base, "Versions", "Current")
          if os.path.islink(cur) or os.path.isfile(cur):
              os.remove(cur)
              open(cur, "w").write("156.0.8078.48")
              print("flattened Versions/Current")
          PY
            race cdn_flatten "$CDNAPP/Contents/MacOS/ShardX" 9952
          else
            echo "cdn app not found" | tee -a $OUT/race.tsv
          fi

          OURS="/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64/ShardX.app/Contents/MacOS/ShardX_core"
          race ours_engine "$OURS" 9953
          echo "--- race done ---"
          cat $OUT/race.tsv
          pkill -9 -f ShardX 2>/dev/null
          exit 0

      - name: 2e. Приёмка — профиль через обёртку (с отпечатком и без)
        run: |
          set +e
          OUT=/tmp/ma_probe
          RT="/Applications/M&A Antidetect/MA DATA/runtime/ShardX-Mac-arm64"
          FWR="$RT/ShardX.app/Contents/Frameworks/ShardX Framework.framework/Versions/156.0.8078.48/ShardX Framework"
          echo "installed_fw_md5=$(md5 -q "$FWR")" | tee $OUT/accept_fw.txt
          echo "os=$(sw_vers -productVersion) build=$(sw_vers -buildVersion)" | tee -a $OUT/accept_fw.txt
          : > $OUT/accept.tsv

          ALLOW=""
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -lt 15 ]; then
            ALLOW=1
            echo "pre-15 OS detected -> SHARDX_ALLOW_UNSUPPORTED_OS=1" | tee -a $OUT/accept_fw.txt
          fi

          acc() {
            local name=$1; local port=$2; local withfp=$3
            local ud=/tmp/acc_$name
            rm -rf $ud; mkdir -p $ud
            if [ "$withfp" = "yes" ]; then
              local fp=$(ls "/Applications/M&A Antidetect/MA DATA/fingerprints"/*.json 2>/dev/null | head -1)
              if [ -n "$fp" ]; then cp "$fp" $ud/fingerprint.json; echo "fp=$(basename "$fp")" >> $OUT/accept.tsv; fi
            fi
            if [ -n "$ALLOW" ]; then
              SHARDX_ALLOW_UNSUPPORTED_OS=1 "$RT/ShardX" --user-data-dir=$ud --no-first-run --no-default-browser-check --window-size=534,969 --remote-debugging-port=$port about:blank >$OUT/acc_$name.log 2>&1 &
            else
              "$RT/ShardX" --user-data-dir=$ud --no-first-run --no-default-browser-check --window-size=534,969 --remote-debugging-port=$port about:blank >$OUT/acc_$name.log 2>&1 &
            fi
            local p=$!
            sleep 14
            local alive=no; kill -0 $p 2>/dev/null && alive=yes
            local CP=$(pgrep -x ShardX_core | head -1)
            local cpu=$(ps -p ${CP:-0} -o %cpu= 2>/dev/null | tr -d ' ')
            local win
            if [ -n "$CP" ] && [ -x /tmp/wl ]; then win=$(/tmp/wl $CP 2>/dev/null | tr '\n' ';'); else win="(no core)"; fi
            local cdp=$(curl -s -m 3 http://127.0.0.1:$port/json/version | head -c 50)
            local marker=$(cat $ud/window_ready 2>/dev/null | tr -d '\n')
            local err=$(head -1 $ud/launch_error.txt 2>/dev/null | cut -c1-90)
            printf "%s\twrapper=%s\tcpu=%s\twin=%s\tcdp=%s\tmarker=%s\terr=%s\n" \
              "$name" "$alive" "${cpu:-?}" "${win:-none}" "${cdp:-none}" "${marker:-none}" "${err:-none}" | tee -a $OUT/accept.tsv
            screencapture -x $OUT/acc_${name}.png 2>/dev/null
            kill -9 $p 2>/dev/null
            pkill -9 -f "user-data-dir=$ud" 2>/dev/null
            sleep 3
          }

          acc plain 9971 no
          acc fp    9972 yes
          echo "--- accept done ---"
          cat $OUT/accept.tsv
          pkill -9 -x ShardX_core 2>/dev/null
          exit 0

