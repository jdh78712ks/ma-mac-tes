name: Test MA Launcher on macOS M1 (ARM64)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Прямая ссылка на zip (оставьте пустым — скачается из Releases репозитория)"
        required: false
        default: ""
      keep_alive_minutes:
        description: "Сколько минут держать рабочий стол Mac M1 в браузере (30 FPS)"
        required: false
        default: "30"

jobs:
  macos-m1-test:
    name: Apple M1 (ARM64) 30 FPS Live Desktop
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Настройка пароля macOS и проверка архитектуры (Apple Silicon ARM64)
        run: |
          echo "=== Настройка пароля администратора для runner ==="
          sudo dscl . -passwd /Users/runner ma123456 2>/dev/null || true
          echo -e "ma123456\nma123456" | sudo passwd runner 2>/dev/null || true
          echo "✅ Пароль администратора macOS установлен: ma123456 (пользователь: runner)"
          echo "=== Информация о системе ==="
          uname -m
          sw_vers
          sysctl -n machdep.cpu.brand_string

      - name: 2. Скачивание и установка M&A-Setup-macOS.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set +e
          mkdir -p /tmp/ma_installer /tmp/ma_screenshots
          cd /tmp/ma_installer

          if [ -n "$ZIP_URL" ]; then
            echo "Скачивание по прямой ссылке..."
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "$ZIP_URL"
          else
            echo "Скачивание zip архива из Releases репозитория ${GITHUB_REPOSITORY}..."
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir "/tmp/ma_installer" --clobber || \
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/M%26A-Setup-macOS.zip" || \
            curl -L --fail -o "/tmp/ma_installer/setup.zip" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/M.A-Setup-macOS.zip"
          fi

          ZIP_FOUND=$(find /tmp/ma_installer -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FOUND" ] && [ -f "$ZIP_FOUND" ]; then
            echo "Найден архив: $ZIP_FOUND ($(ls -lh "$ZIP_FOUND" | awk '{print $5}'))"
            echo "Распаковка через ditto..."
            /usr/bin/ditto -x -k "$ZIP_FOUND" "/tmp/ma_installer/extracted"

            SETUP_APP=$(find /tmp/ma_installer/extracted -name "M&A-Setup.app" | head -n 1)
            if [ -n "$SETUP_APP" ]; then
              chmod +x "$SETUP_APP/Contents/MacOS/M&A-Setup"
              xattr -cr "$SETUP_APP" 2>/dev/null
              echo "Запуск графического инсталлятора M&A-Setup..."
              "$SETUP_APP/Contents/MacOS/M&A-Setup"
            else
              echo "M&A-Setup.app не найден, проверка наличия распакованных файлов..."
            fi

            echo "=== Проверка установленных файлов в /Applications/M&A Antidetect ==="
            ls -la "/Applications/M&A Antidetect" 2>/dev/null || true
            ls -la "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS" 2>/dev/null || true
            ls -la "/Applications/M&A Antidetect/MA DATA/runtime" 2>/dev/null || true

            echo "Подтверждение подписи и запуск M&A Launcher.app..."
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher-core" 2>/dev/null || true
            /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher" 2>/dev/null || true
            /usr/bin/codesign --force --deep --sign - "/Applications/M&A Antidetect/M&A Launcher.app" 2>/dev/null || true
            /usr/bin/xattr -cr "/Applications/M&A Antidetect/M&A Launcher.app" 2>/dev/null || true
            open "/Applications/M&A Antidetect/M&A Launcher.app" || open "/Applications/M&A Launcher.app"
            sleep 6
            ps aux | grep -iE "shardx|M&A|launcher"
            if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              for f in "$HOME/Library/Logs/DiagnosticReports"/*; do
                if [ -f "$f" ]; then
                  echo "--- Crash report: $f ---"
                  head -n 45 "$f"
                fi
              done
            fi
          else
            echo "ОШИБКА: Архив с дистрибутивом не найден в Releases!"
            exit 1
          fi
          exit 0

      - name: 3. Скриншот рабочего стола после установки
        run: |
          set +e
          mkdir -p /tmp/ma_screenshots
          screencapture -x /tmp/ma_screenshots/01_desktop_after_install.png
          ls -la /tmp/ma_screenshots
          exit 0

      - name: 4. Выгрузка скриншотов в Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-m1-screenshots
          path: /tmp/ma_screenshots/*.png
          if-no-files-found: ignore

      - name: 5. Запуск интерактивного экрана Mac M1 в браузере (30 FPS Web VPS)
        if: ${{ inputs.keep_alive_minutes != '0' }}
        env:
          KEEP_MINS: ${{ inputs.keep_alive_minutes }}
        run: |
          set +e
          caffeinate -u -t 7200 >/dev/null 2>&1 &

          cat << 'EOF' > /tmp/mac_fast.c
          #include <ApplicationServices/ApplicationServices.h>
          #include <ImageIO/ImageIO.h>
          #include <CoreServices/CoreServices.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          void send_click(CGPoint pt, CGMouseButton btn, CGEventType dn_type, CGEventType up_type) {
              CGEventRef m = CGEventCreateMouseEvent(NULL, kCGEventMouseMoved, pt, kCGMouseButtonLeft);
              if (m) { CGEventPost(kCGHIDEventTap, m); CFRelease(m); usleep(20000); }
              CGEventRef dn = CGEventCreateMouseEvent(NULL, dn_type, pt, btn);
              CGEventRef up = CGEventCreateMouseEvent(NULL, up_type, pt, btn);
              if (dn) { CGEventPost(kCGHIDEventTap, dn); CFRelease(dn); }
              usleep(40000);
              if (up) { CGEventPost(kCGHIDEventTap, up); CFRelease(up); }
          }

          void type_utf8(const char *utf8_str) {
              CFStringRef str = CFStringCreateWithCString(NULL, utf8_str, kCFStringEncodingUTF8);
              if (!str) return;
              CFIndex len = CFStringGetLength(str);
              UniChar buf[len];
              CFStringGetCharacters(str, CFRangeMake(0, len), buf);
              for (CFIndex i = 0; i < len; i++) {
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)0, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)0, false);
                  CGEventKeyboardSetUnicodeString(dn, 1, &buf[i]);
                  CGEventKeyboardSetUnicodeString(up, 1, &buf[i]);
                  CGEventPost(kCGHIDEventTap, dn);
                  usleep(15000);
                  CGEventPost(kCGHIDEventTap, up);
                  usleep(15000);
                  CFRelease(dn);
                  CFRelease(up);
              }
              CFRelease(str);
          }

          void save_display_jpeg(CGDirectDisplayID d, const char *out_path) {
              CGImageRef img = CGDisplayCreateImage(d);
              if (!img) return;
              CFStringRef path_cf = CFStringCreateWithCString(NULL, out_path, kCFStringEncodingUTF8);
              CFURLRef url = CFURLCreateWithFileSystemPath(NULL, path_cf, kCFURLPOSIXPathStyle, false);
              CGImageDestinationRef dest = CGImageDestinationCreateWithURL(url, (CFStringRef)CFSTR("public.jpeg"), 1, NULL);
              if (dest) {
                  float q = 0.55f;
                  CFNumberRef q_num = CFNumberCreate(NULL, kCFNumberFloatType, &q);
                  CFStringRef keys[] = { kCGImageDestinationLossyCompressionQuality };
                  CFTypeRef values[] = { q_num };
                  CFDictionaryRef opts = CFDictionaryCreate(NULL, (const void **)keys, (const void **)values, 1, &kCFTypeDictionaryKeyCallBacks, &kCFTypeDictionaryValueCallBacks);
                  CGImageDestinationAddImage(dest, img, opts);
                  CGImageDestinationFinalize(dest);
                  CFRelease(dest);
                  CFRelease(opts);
                  CFRelease(q_num);
              }
              if (url) CFRelease(url);
              if (path_cf) CFRelease(path_cf);
              CGImageRelease(img);
          }

          int main(int argc, char **argv) {
              if (argc < 2) return 1;
              const char *cmd = argv[1];
              CGDirectDisplayID main_d = CGMainDisplayID();
              if (strcmp(cmd, "daemon") == 0 && argc >= 3) {
                  const char *p = argv[2];
                  char tmp[256];
                  snprintf(tmp, sizeof(tmp), "%s.tmp.jpg", p);
                  while (1) {
                      save_display_jpeg(main_d, tmp);
                      rename(tmp, p);
                      usleep(33333);
                  }
                  return 0;
              } else if (strcmp(cmd, "size") == 0) {
                  size_t w = CGDisplayPixelsWide(main_d);
                  size_t h = CGDisplayPixelsHigh(main_d);
                  printf("%zu %zu\n", w, h);
                  return 0;
              } else if (strcmp(cmd, "click") == 0 && argc >= 4) {
                  CGPoint pt = CGPointMake(atof(argv[2]), atof(argv[3]));
                  send_click(pt, kCGMouseButtonLeft, kCGEventLeftMouseDown, kCGEventLeftMouseUp);
              } else if (strcmp(cmd, "rclick") == 0 && argc >= 4) {
                  CGPoint pt = CGPointMake(atof(argv[2]), atof(argv[3]));
                  send_click(pt, kCGMouseButtonRight, kCGEventRightMouseDown, kCGEventRightMouseUp);
              } else if (strcmp(cmd, "dclick") == 0 && argc >= 4) {
                  CGPoint pt = CGPointMake(atof(argv[2]), atof(argv[3]));
                  CGEventRef dn1 = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDown, pt, kCGMouseButtonLeft);
                  CGEventRef up1 = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseUp, pt, kCGMouseButtonLeft);
                  CGEventRef dn2 = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDown, pt, kCGMouseButtonLeft);
                  CGEventRef up2 = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseUp, pt, kCGMouseButtonLeft);
                  CGEventSetIntegerValueField(dn1, kCGMouseEventClickState, 1);
                  CGEventSetIntegerValueField(up1, kCGMouseEventClickState, 1);
                  CGEventSetIntegerValueField(dn2, kCGMouseEventClickState, 2);
                  CGEventSetIntegerValueField(up2, kCGMouseEventClickState, 2);
                  CGEventPost(kCGHIDEventTap, dn1); usleep(20000);
                  CGEventPost(kCGHIDEventTap, up1); usleep(30000);
                  CGEventPost(kCGHIDEventTap, dn2); usleep(20000);
                  CGEventPost(kCGHIDEventTap, up2);
                  CFRelease(dn1); CFRelease(up1); CFRelease(dn2); CFRelease(up2);
              } else if (strcmp(cmd, "drag") == 0 && argc >= 6) {
                  CGPoint p1 = CGPointMake(atof(argv[2]), atof(argv[3]));
                  CGPoint p2 = CGPointMake(atof(argv[4]), atof(argv[5]));
                  CGEventRef m1 = CGEventCreateMouseEvent(NULL, kCGEventMouseMoved, p1, kCGMouseButtonLeft);
                  CGEventRef dn = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDown, p1, kCGMouseButtonLeft);
                  if (m1) { CGEventPost(kCGHIDEventTap, m1); CFRelease(m1); usleep(20000); }
                  if (dn) { CGEventPost(kCGHIDEventTap, dn); CFRelease(dn); usleep(40000); }
                  int steps = 10;
                  for (int i = 1; i <= steps; i++) {
                      CGPoint cur = CGPointMake(p1.x + (p2.x - p1.x)*i/steps, p1.y + (p2.y - p1.y)*i/steps);
                      CGEventRef drg = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseDragged, cur, kCGMouseButtonLeft);
                      if (drg) { CGEventPost(kCGHIDEventTap, drg); CFRelease(drg); usleep(15000); }
                  }
                  CGEventRef up = CGEventCreateMouseEvent(NULL, kCGEventLeftMouseUp, p2, kCGMouseButtonLeft);
                  if (up) { CGEventPost(kCGHIDEventTap, up); CFRelease(up); }
              } else if (strcmp(cmd, "scroll") == 0 && argc >= 5) {
                  CGPoint pt = CGPointMake(atof(argv[2]), atof(argv[3]));
                  int dy = atoi(argv[4]);
                  CGEventRef scr = CGEventCreateScrollWheelEvent(NULL, kCGScrollEventUnitLine, 1, dy);
                  if (scr) {
                      CGEventSetLocation(scr, pt);
                      CGEventPost(kCGHIDEventTap, scr);
                      CFRelease(scr);
                  }
              } else if (strcmp(cmd, "key") == 0 && argc >= 3) {
                  CGKeyCode kc = (CGKeyCode)atoi(argv[2]);
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, kc, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, kc, false);
                  if (dn) { CGEventPost(kCGHIDEventTap, dn); usleep(20000); CFRelease(dn); }
                  if (up) { CGEventPost(kCGHIDEventTap, up); CFRelease(up); }
              } else if (strcmp(cmd, "cmdkey") == 0 && argc >= 3) {
                  CGKeyCode kc = (CGKeyCode)atoi(argv[2]);
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, kc, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, kc, false);
                  if (dn && up) {
                      CGEventSetFlags(dn, kCGEventFlagMaskCommand);
                      CGEventSetFlags(up, kCGEventFlagMaskCommand);
                      CGEventPost(kCGHIDEventTap, dn);
                      usleep(20000);
                      CGEventPost(kCGHIDEventTap, up);
                  }
                  if (dn) CFRelease(dn);
                  if (up) CFRelease(up);
              } else if (strcmp(cmd, "text") == 0 && argc >= 3) {
                  type_utf8(argv[2]);
              }
              return 0;
          }
          EOF

          echo "Компиляция высокоскоростного движка ввода и захвата экрана (CoreGraphics 30 FPS)..."
          clang -O3 -framework ApplicationServices -framework ImageIO -framework CoreServices /tmp/mac_fast.c -o /tmp/mac_fast

          nohup /tmp/mac_fast daemon /tmp/live_frame.jpg >/dev/null 2>&1 &

          cat << 'EOF' > /tmp/web_desk.py
          import os, sys, time, json, threading, subprocess
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse, parse_qs

          SCREEN_W, SCREEN_H = 1920, 1080
          try:
              out = subprocess.check_output(["/tmp/mac_fast", "size"]).decode().strip().split()
              if len(out) == 2:
                  SCREEN_W, SCREEN_H = int(out[0]), int(out[1])
          except Exception:
              pass

          HTML_PAGE = """<!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>M&A Launcher — Live Mac M1 (30 FPS VPS)</title>
          <style>
            * { box-sizing: border-box; }
            body { margin: 0; background: #0b0d14; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
            .toolbar { background: #151824; padding: 6px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #23293a; flex-wrap: wrap; z-index: 10; }
            .toolbar b { color: #d9ff66; font-size: 14px; margin-right: 6px; letter-spacing: 0.5px; }
            .toolbar input { background: #0b0d14; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; width: 260px; font-size: 13px; outline: none; }
            .toolbar input:focus { border-color: #d9ff66; }
            .btn { background: #222738; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 6px 11px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; }
            .btn:hover { background: #2f364c; border-color: #94a3b8; }
            .btn.primary { background: #d9ff66; color: #0b0f19; border-color: #d9ff66; font-weight: 700; }
            .btn.primary:hover { background: #c8f542; }
            .btn.accent { background: #4f46e5; color: #fff; border-color: #6366f1; }
            .btn.accent:hover { background: #4338ca; }
            .screen-wrap { flex: 1; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; user-select: none; background: #000; }
            #screen { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
            .status { margin-left: auto; font-size: 12px; color: #94a3b8; display: flex; gap: 12px; align-items: center; }
            .badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
          </style>
          </head>
          <body>
          <div class="toolbar">
            <b> Mac M1 (ARM64)</b>
            <input id="txt" type="text" placeholder="Текст / Токен / Логин / Пароль..." />
            <button class="btn primary" onclick="sendText()">Ввести текст</button>
            <button class="btn accent" onclick="pasteText()">Вставить (Cmd+V)</button>
            <button class="btn" onclick="sendKey(36)">Enter ↵</button>
            <button class="btn" onclick="sendKey(51)">⌫</button>
            <button class="btn" onclick="sendKey(48)">Tab ⇥</button>
            <button class="btn" onclick="sendKey(53)">Esc</button>
            <button class="btn" onclick="sendCmdKey(0)">Cmd+A</button>
            <button class="btn" onclick="sendCmdKey(8)">Cmd+C</button>
            <button class="btn" onclick="runApp('launcher')">🚀 M&A Launcher</button>
            <button class="btn" onclick="runApp('safari')">🌐 Safari</button>
            <button class="btn" onclick="runApp('terminal')">💻 Terminal</button>
            <button class="btn" onclick="runApp('finder')">📂 Finder</button>
            <button class="btn" onclick="runApp('restart')">🔄 Рестарт M&A</button>
            <div class="status">
              <span class="badge">30 FPS Stream</span>
              <span id="st">Экран: __SW__x__SH__</span>
            </div>
          </div>
          <div class="screen-wrap">
            <img id="screen" src="/stream" draggable="false" />
          </div>
          <script>
          const SW = __SW__, SH = __SH__;
          const img = document.getElementById('screen');
          const st = document.getElementById('st');
          let dragStart = null;

          img.onerror = function() {
            setTimeout(function() {
              img.src = '/stream?t=' + Date.now();
            }, 1000);
          };

          function getCoords(e) {
            const r = img.getBoundingClientRect();
            const x = Math.round(((e.clientX - r.left) / r.width) * SW);
            const y = Math.round(((e.clientY - r.top) / r.height) * SH);
            return { x: Math.max(0, Math.min(SW, x)), y: Math.max(0, Math.min(SH, y)) };
          }

          img.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
              dragStart = getCoords(e);
            }
          });

          img.addEventListener('mouseup', function(e) {
            if (e.button === 0 && dragStart) {
              const end = getCoords(e);
              const dist = Math.hypot(end.x - dragStart.x, end.y - dragStart.y);
              if (dist > 8) {
                fetch('/api?cmd=drag&x1=' + dragStart.x + '&y1=' + dragStart.y1 + '&x2=' + end.x + '&y2=' + end.y);
                st.textContent = 'Drag: (' + dragStart.x + ',' + dragStart.y + ') -> (' + end.x + ',' + end.y + ')';
              } else {
                fetch('/api?cmd=click&x=' + end.x + '&y=' + end.y);
                st.textContent = 'Click: (' + end.x + ', ' + end.y + ')';
              }
              dragStart = null;
            }
          });

          img.addEventListener('dblclick', function(e) {
            const c = getCoords(e);
            fetch('/api?cmd=dclick&x=' + c.x + '&y=' + c.y);
            st.textContent = 'Double Click: (' + c.x + ', ' + c.y + ')';
          });

          img.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const c = getCoords(e);
            fetch('/api?cmd=rclick&x=' + c.x + '&y=' + c.y);
            st.textContent = 'Right Click: (' + c.x + ', ' + c.y + ')';
          });

          img.addEventListener('wheel', function(e) {
            e.preventDefault();
            const c = getCoords(e);
            const dy = e.deltaY > 0 ? -4 : 4;
            fetch('/api?cmd=scroll&x=' + c.x + '&y=' + c.y + '&dy=' + dy);
          }, { passive: false });

          function sendText() {
            const el = document.getElementById('txt');
            const v = el.value;
            if (!v) return;
            fetch('/api?cmd=text&val=' + encodeURIComponent(v));
            st.textContent = 'Ввод текста: ' + v.slice(0, 15) + '...';
            el.value = '';
          }

          function pasteText() {
            const el = document.getElementById('txt');
            const v = el.value;
            if (!v) return;
            fetch('/api?cmd=paste&val=' + encodeURIComponent(v));
            st.textContent = 'Вставка буфера (Cmd+V)';
            el.value = '';
          }

          function sendKey(kc) {
            fetch('/api?cmd=key&kc=' + kc);
            st.textContent = 'Клавиша: ' + kc;
          }

          function sendCmdKey(kc) {
            fetch('/api?cmd=cmdkey&kc=' + kc);
            st.textContent = 'Cmd+' + kc;
          }

          function runApp(name) {
            fetch('/api?cmd=app&name=' + name);
            st.textContent = 'Запуск: ' + name;
          }

          document.getElementById('txt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              sendText();
            }
          });
          </script>
          </body>
          </html>
          """.replace("__SW__", str(SCREEN_W)).replace("__SH__", str(SCREEN_H))

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  pr = urlparse(self.path)
                  if pr.path in ("/", "/index.html"):
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.end_headers()
                      self.wfile.write(HTML_PAGE.encode("utf-8"))
                  elif pr.path == "/stream":
                      self.send_response(200)
                      self.send_header("Content-Type", "multipart/x-mixed-replace; boundary=frame")
                      self.send_header("Cache-Control", "no-cache, no-store, must-revalidate")
                      self.send_header("Pragma", "no-cache")
                      self.send_header("Expires", "0")
                      self.end_headers()
                      last_mtime = 0
                      try:
                          while True:
                              p = "/tmp/live_frame.jpg"
                              if os.path.exists(p):
                                  m = os.path.getmtime(p)
                                  if m != last_mtime:
                                      last_mtime = m
                                      with open(p, "rb") as f:
                                          jpg = f.read()
                                      header = (
                                          b"--frame\r\n"
                                          b"Content-Type: image/jpeg\r\n"
                                          b"Content-Length: " + str(len(jpg)).encode() + b"\r\n\r\n"
                                      )
                                      self.wfile.write(header + jpg + b"\r\n")
                              time.sleep(0.033)
                      except (BrokenPipeError, ConnectionResetError):
                          pass
                  elif pr.path == "/api":
                      qs = parse_qs(pr.query)
                      cmd = qs.get("cmd", [""])[0]
                      if cmd in ("click", "rclick", "dclick"):
                          x = qs.get("x", ["0"])[0]
                          y = qs.get("y", ["0"])[0]
                          subprocess.Popen(["/tmp/mac_fast", cmd, x, y])
                      elif cmd == "drag":
                          x1 = qs.get("x1", ["0"])[0]
                          y1 = qs.get("y1", ["0"])[0]
