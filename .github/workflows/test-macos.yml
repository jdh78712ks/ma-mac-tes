            <input id="txt" type="text" placeholder="Текст / Токен..." />
            <button class="btn" onclick="sendText()">Ввод</button>
            <button class="btn" onclick="sendKey(36)">Enter ↵</button>
            <button class="btn" onclick="sendKey(51)">⌫</button>
            <button class="btn" onclick="sendKey(48)">Tab ⇥</button>
            <button class="btn" onclick="sendKey(53)">Esc</button>
            <button class="btn" onclick="sendCmdKey(0)">Cmd+A</button>
            <button class="btn" onclick="runApp('launcher')">🚀 M&A Launcher</button>
            <button class="btn" onclick="runApp('safari')">🌐 Safari</button>
            <button class="btn" onclick="runApp('terminal')">💻 Terminal</button>
            <button class="btn" onclick="runApp('finder')">📂 Finder</button>
            <button class="btn" onclick="runApp('restart')">🔄 Рестарт M&A</button>
            <div class="status">
              <span class="badge">30 FPS Stream</span>
              <span id="st">Экран: __SW__x__SH__</span>
            </div>
          </div>
          <div class="screen-wrap">
            <img id="screen" src="/stream" draggable="false" />
          </div>
          <div id="toast" class="toast"></div>
          <script>
          const SW = __SW__, SH = __SH__;
          const img = document.getElementById('screen');
          const st = document.getElementById('st');
          const toastEl = document.getElementById('toast');
          let toastTimer = null;
          let lastPasteTs = 0;
          let dragStart = null;

          function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
              toastEl.classList.remove('show');
            }, 2600);
          }

          img.onerror = function() {
            setTimeout(function() {
              img.src = '/stream?t=' + Date.now();
            }, 1000);
          };

          function getCoords(e) {
            const r = img.getBoundingClientRect();
            const x = Math.round(((e.clientX - r.left) / r.width) * SW);
            const y = Math.round(((e.clientY - r.top) / r.height) * SH);
            return { x: Math.max(0, Math.min(SW, x)), y: Math.max(0, Math.min(SH, y)) };
          }

          img.addEventListener('mousedown', function(e) {
            if (e.button === 0) dragStart = getCoords(e);
          });

          img.addEventListener('mouseup', function(e) {
            const c = getCoords(e);
            if (e.button === 0 && dragStart) {
              const dx = Math.abs(c.x - dragStart.x);
              const dy = Math.abs(c.y - dragStart.y);
              if (dx > 8 || dy > 8) {
                fetch('/api?cmd=drag&x1=' + dragStart.x + '&y1=' + dragStart.y + '&x2=' + c.x + '&y2=' + c.y);
                st.textContent = 'Drag: ' + dragStart.x + ',' + dragStart.y + ' -> ' + c.x + ',' + c.y;
                dragStart = null;
                return;
              }
            }
            dragStart = null;
            if (e.button === 0) {
              fetch('/api?cmd=click&x=' + c.x + '&y=' + c.y);
              st.textContent = 'Click: (' + c.x + ', ' + c.y + ')';
            }
          });

          img.addEventListener('dblclick', function(e) {
            e.preventDefault();
            const c = getCoords(e);
            fetch('/api?cmd=dblclick&x=' + c.x + '&y=' + c.y);
            st.textContent = 'Double Click: (' + c.x + ', ' + c.y + ')';
          });

          img.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const c = getCoords(e);
            fetch('/api?cmd=rclick&x=' + c.x + '&y=' + c.y);
            st.textContent = 'Right Click: (' + c.x + ', ' + c.y + ')';
          });

          img.addEventListener('wheel', function(e) {
            e.preventDefault();
            const c = getCoords(e);
            const dy = e.deltaY > 0 ? -4 : 4;
            fetch('/api?cmd=scroll&x=' + c.x + '&y=' + c.y + '&dy=' + dy);
          }, { passive: false });

          function sendDirectPaste(text) {
            if (!text) return;
            fetch('/api/paste', {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain; charset=utf-8' },
              body: text
            }).then(function(res) {
              const preview = text.length > 25 ? text.slice(0, 25) + '…' : text;
              showToast('📋 Вставлено на Mac: ' + preview + ' (' + text.length + ' симв.)');
              st.textContent = 'Вставка: ' + preview;
            }).catch(function(err) {
              showToast('❌ Ошибка вставки: ' + err);
            });
          }

          function safePaste(text) {
            const now = Date.now();
            if (now - lastPasteTs < 350) return;
            lastPasteTs = now;
            sendDirectPaste(text);
          }

          async function directPasteFromClipboard() {
            if (navigator.clipboard && navigator.clipboard.readText) {
              try {
                const t = await navigator.clipboard.readText();
                if (t) {
                  safePaste(t);
                  return;
                }
              } catch (err) {
                console.warn('Clipboard read error:', err);
              }
            }
            const manual = prompt('Вставьте текст из буфера обмена (Ctrl+V):');
            if (manual) {
              safePaste(manual);
            }
          }

          async function fetchRemoteClipboard(showNotification) {
            try {
              const res = await fetch('/api?cmd=get_clip');
              const data = await res.json();
              const clip = data.clip || '';
              if (!clip) {
                if (showNotification) showToast('ℹ Буфер Mac пуст');
                return;
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(clip);
                const preview = clip.length > 25 ? clip.slice(0, 25) + '…' : clip;
                showToast('📋 Скопировано в ваш буфер: ' + preview + ' (' + clip.length + ' симв.)');
              } else {
                prompt('Буфер с Mac (Ctrl+C для копирования):', clip);
              }
            } catch (err) {
              if (showNotification) showToast('❌ Ошибка буфера Mac: ' + err);
            }
          }

          function copyFromRemoteMac() {
            fetch('/api?cmd=cmdkey&kc=8').then(function() {
              setTimeout(function() {
                fetchRemoteClipboard(true);
              }, 200);
            });
          }

          function sendText() {
            const el = document.getElementById('txt');
            const v = el.value;
            if (!v) return;
            fetch('/api?cmd=text&val=' + encodeURIComponent(v));
            st.textContent = 'Ввод: ' + v.slice(0, 15) + '...';
            el.value = '';
          }

          function sendKey(kc) {
            fetch('/api?cmd=key&kc=' + kc);
            st.textContent = 'Клавиша: ' + kc;
          }

          function sendCmdKey(kc) {
            fetch('/api?cmd=cmdkey&kc=' + kc);
            st.textContent = 'Cmd+' + kc;
          }

          function runApp(name) {
            fetch('/api?cmd=app&name=' + name);
            st.textContent = 'Запуск: ' + name;
          }

          document.getElementById('txt').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              sendText();
            }
          });

          // Native clipboard paste event
          window.addEventListener('paste', function(e) {
            if (document.activeElement === document.getElementById('txt')) return;
            e.preventDefault();
            let text = '';
            if (e.clipboardData && e.clipboardData.getData) {
              text = e.clipboardData.getData('text/plain');
            }
            if (text) {
              safePaste(text);
            } else if (navigator.clipboard && navigator.clipboard.readText) {
              navigator.clipboard.readText().then(function(t) {
                if (t) safePaste(t);
              }).catch(function() {});
            }
          });

          // Global keyboard shortcuts
          window.addEventListener('keydown', function(e) {
            if (document.activeElement === document.getElementById('txt')) return;

            // Ctrl+V or Cmd+V -> direct paste
            if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
              e.preventDefault();
              directPasteFromClipboard();
              return;
            }
            // Ctrl+C or Cmd+C -> copy from remote Mac into PC clipboard
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
              e.preventDefault();
              copyFromRemoteMac();
              return;
            }
            // Ctrl+X or Cmd+X -> cut on remote Mac into PC clipboard
            if ((e.ctrlKey || e.metaKey) && (e.key === 'x' || e.key === 'X')) {
              e.preventDefault();
              fetch('/api?cmd=cmdkey&kc=7').then(function() {
                setTimeout(function() { fetchRemoteClipboard(true); }, 200);
              });
              return;
            }
            // Ctrl+A or Cmd+A -> select all
            if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
              e.preventDefault();
              sendCmdKey(0);
              return;
            }
            // Ctrl+Z or Cmd+Z -> undo
            if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
              e.preventDefault();
              sendCmdKey(6);
              return;
            }

            if (e.key === 'Enter') { e.preventDefault(); sendKey(36); }
            else if (e.key === 'Backspace') { e.preventDefault(); sendKey(51); }
            else if (e.key === 'Tab') { e.preventDefault(); sendKey(48); }
            else if (e.key === 'Escape') { e.preventDefault(); sendKey(53); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); sendKey(126); }
            else if (e.key === 'ArrowDown') { e.preventDefault(); sendKey(125); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); sendKey(123); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); sendKey(124); }
            else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
              fetch('/api?cmd=text&val=' + encodeURIComponent(e.key));
            }
          });
          </script>
          </body>
          </html>
          """.replace("__SW__", str(SCREEN_W)).replace("__SH__", str(SCREEN_H))

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_OPTIONS(self):
                  self.send_response(200)
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.send_header("Access-Control-Allow-Methods", "GET, POST, OPTIONS")
                  self.send_header("Access-Control-Allow-Headers", "Content-Type")
                  self.end_headers()

              def do_POST(self):
                  u = urlparse(self.path)
                  if u.path in ("/api/paste", "/api"):
                      length = int(self.headers.get('Content-Length', 0))
                      body = self.rfile.read(length).decode('utf-8', errors='replace')
                      text = body
                      try:
                          j = json.loads(body)
                          if isinstance(j, dict) and 'text' in j:
                              text = j['text']
                      except Exception:
                          pass
                      if text:
                          try:
                              p = subprocess.Popen(["/usr/bin/pbcopy"], stdin=subprocess.PIPE)
                              p.communicate(text.encode("utf-8"))
                              time.sleep(0.02)
                              subprocess.Popen(["/tmp/mac_fast", "cmdkey", "9"])
                          except Exception:
                              pass
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json; charset=utf-8")
                      self.send_header("Access-Control-Allow-Origin", "*")
                      self.end_headers()
                      self.wfile.write(b'{"ok":true}')
                      return
                  self.send_response(404)
                  self.end_headers()

              def do_GET(self):
                  u = urlparse(self.path)
                  if u.path in ("/", "/index.html", "/vnc.html"):
                      data = HTML_PAGE.encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
                  elif u.path == "/stream":
                      self.send_response(200)
                      self.send_header("Content-Type", "multipart/x-mixed-replace; boundary=--frame")
                      self.send_header("Cache-Control", "no-cache, no-store, must-revalidate")
                      self.send_header("Pragma", "no-cache")
                      self.send_header("Connection", "close")
                      self.end_headers()
                      last_mtime = 0.0
                      while True:
                          try:
                              if os.path.exists("/tmp/live_frame.jpg"):
                                  mt = os.path.getmtime("/tmp/live_frame.jpg")
                                  if mt > last_mtime:
                                      last_mtime = mt
                                      with open("/tmp/live_frame.jpg", "rb") as f:
                                          data = f.read()
                                      if data and len(data) > 1000:
                                          self.wfile.write(b"--frame\r\n")
                                          self.wfile.write(b"Content-Type: image/jpeg\r\n")
                                          self.wfile.write(f"Content-Length: {len(data)}\r\n\r\n".encode("ascii"))
                                          self.wfile.write(data)
                                          self.wfile.write(b"\r\n")
                                          self.wfile.flush()
                                  time.sleep(0.033) # 30 FPS
                          except Exception:
                              break
                  elif u.path == "/frame.jpg":
                      jpg = b""
                      try:
                          if os.path.exists("/tmp/live_frame.jpg"):
                              with open("/tmp/live_frame.jpg", "rb") as f:
                                  jpg = f.read()
                      except Exception:
                          pass
                      self.send_response(200)
                      self.send_header("Content-Type", "image/jpeg")
                      self.send_header("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0")
                      self.send_header("Content-Length", str(len(jpg)))
                      self.end_headers()
                      if jpg: self.wfile.write(jpg)
                  elif u.path == "/api":
                      q = parse_qs(u.query)
                      cmd = q.get("cmd", [""])[0]
                      if cmd in ("get_clip", "clipboard"):
                          clip = ""
                          try:
                              p = subprocess.Popen(["/usr/bin/pbpaste"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                              out, _ = p.communicate(timeout=2)
                              clip = out.decode("utf-8", errors="replace")
                          except Exception:
                              clip = ""
                          data = json.dumps({"ok": True, "clip": clip}).encode("utf-8")
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json; charset=utf-8")
                          self.send_header("Access-Control-Allow-Origin", "*")
                          self.send_header("Content-Length", str(len(data)))
                          self.end_headers()
                          self.wfile.write(data)
                          return
                      elif cmd in ("click", "dblclick", "rclick"):
                          subprocess.Popen(["/tmp/mac_fast", cmd, q.get("x", ["0"])[0], q.get("y", ["0"])[0]])
                      elif cmd == "drag":
                          subprocess.Popen(["/tmp/mac_fast", "drag", q.get("x1", ["0"])[0], q.get("y1", ["0"])[0], q.get("x2", ["0"])[0], q.get("y2", ["0"])[0]])
                      elif cmd == "scroll":
                          subprocess.Popen(["/tmp/mac_fast", "scroll", q.get("x", ["0"])[0], q.get("y", ["0"])[0], q.get("dy", ["0"])[0]])
                      elif cmd == "key":
                          subprocess.Popen(["/tmp/mac_fast", "key", q.get("kc", ["36"])[0]])
                      elif cmd == "cmdkey":
                          subprocess.Popen(["/tmp/mac_fast", "cmdkey", q.get("kc", ["0"])[0]])
                      elif cmd == "text":
                          val = q.get("val", [""])[0]
                          if val: subprocess.Popen(["/tmp/mac_fast", "text", val])
                      elif cmd == "paste":
                          val = q.get("val", [""])[0]
                          if val:
                              try:
                                  p = subprocess.Popen(["/usr/bin/pbcopy"], stdin=subprocess.PIPE)
                                  p.communicate(val.encode("utf-8"))
                                  time.sleep(0.02)
                                  subprocess.Popen(["/tmp/mac_fast", "cmdkey", "9"])
                              except Exception:
                                  pass
                      elif cmd == "app":
                          name = q.get("name", [""])[0]
                          if name == "launcher":
                              subprocess.Popen(["/bin/bash", "-c", """
                              /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher-core" 2>/dev/null || true
                              /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher" 2>/dev/null || true
                              /usr/bin/codesign --force --deep --sign - "/Applications/M&A Antidetect/M&A Launcher.app" 2>/dev/null || true
                              /usr/bin/open "/Applications/M&A Antidetect/M&A Launcher.app"
                              """])
                          elif name == "safari":
                              subprocess.Popen(["/usr/bin/open", "-a", "Safari"])
                          elif name == "terminal":
                              subprocess.Popen(["/usr/bin/open", "-a", "Terminal"])
                          elif name == "finder":
                              subprocess.Popen(["/usr/bin/open", "/Applications/M&A Antidetect"])

                          elif name == "restart":
                              subprocess.Popen(["/bin/bash", "-c", """
                              /usr/bin/killall -9 "M&A Launcher" shardx-launcher shardx-launcher-core 2>/dev/null || true
                              /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher-core" 2>/dev/null || true
                              /usr/bin/codesign --force --sign - "/Applications/M&A Antidetect/M&A Launcher.app/Contents/MacOS/shardx-launcher" 2>/dev/null || true
                              /usr/bin/codesign --force --deep --sign - "/Applications/M&A Antidetect/M&A Launcher.app" 2>/dev/null || true
                              /usr/bin/open "/Applications/M&A Antidetect/M&A Launcher.app"
                              """])
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Access-Control-Allow-Origin", "*")
                      self.end_headers()
                      self.wfile.write(b'{"ok":true}')
                  else:
                      self.send_response(404)
                      self.end_headers()

          ThreadingHTTPServer(("127.0.0.1", 6080), Handler).serve_forever()
