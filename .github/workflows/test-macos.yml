      - name: 5. Запуск интерактивного экрана Mac M1 в браузере (30 FPS Web VPS)
        if: ${{ inputs.keep_alive_minutes != '0' }}
        env:
          KEEP_MINS: ${{ inputs.keep_alive_minutes }}
        run: |
          set +e
          caffeinate -u -t 7200 >/dev/null 2>&1 &

          cat << 'EOF' > /tmp/mac_fast.c
          #include <ApplicationServices/ApplicationServices.h>
          #include <ImageIO/ImageIO.h>
          #include <CoreServices/CoreServices.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <pthread.h>

          static int g_stream_running = 1;
          static float g_quality = 0.65f;

          static void capture_frame_fast(const char* target_file) {
              CGImageRef img = CGDisplayCreateImage(CGMainDisplayID());
              if (!img) return;

              char tmp_file[512];
              snprintf(tmp_file, sizeof(tmp_file), "%s.tmp", target_file);
              CFURLRef url = CFURLCreateFromFileSystemRepresentation(NULL, (const UInt8*)tmp_file, strlen(tmp_file), false);
              if (url) {
                  CGImageDestinationRef dest = CGImageDestinationCreateWithURL(url, CFSTR("public.jpeg"), 1, NULL);
                  if (dest) {
                      CFStringRef key = kCGImageDestinationLossyCompressionQuality;
                      CFNumberRef val = CFNumberCreate(NULL, kCFNumberFloatType, &g_quality);
                      CFDictionaryRef opts = CFDictionaryCreate(NULL, (const void**)&key, (const void**)&val, 1, &kCFTypeDictionaryKeyCallBacks, &kCFTypeDictionaryValueCallBacks);

                      CGImageDestinationAddImage(dest, img, opts);
                      CGImageDestinationFinalize(dest);

                      CFRelease(opts);
                      CFRelease(val);
                      CFRelease(dest);
                      rename(tmp_file, target_file);
                  }
                  CFRelease(url);
              }
              CGImageRelease(img);
          }

          static void* stream_worker(void* arg) {
              const char* out_path = (const char*)arg;
              while (g_stream_running) {
                  capture_frame_fast(out_path);
                  usleep(33000); // ~30 FPS (33ms)
              }
              return NULL;
          }

          static void post_mouse(CGEventType type, double x, double y, CGMouseButton btn, int click_count) {
              CGPoint pt = CGPointMake(x, y);
              CGEventRef ev = CGEventCreateMouseEvent(NULL, type, pt, btn);
              if (ev) {
                  if (click_count > 0) CGEventSetIntegerValueField(ev, kCGMouseEventClickState, click_count);
                  CGEventPost(kCGHIDEventTap, ev);
                  CFRelease(ev);
              }
          }

          static void type_utf8(const char* s) {
              while (*s) {
                  unsigned char c = (unsigned char)*s++;
                  UniChar u = (UniChar)c;
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, 0, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, 0, false);
                  if (dn && up) {
                      CGEventKeyboardSetUnicodeString(dn, 1, &u);
                      CGEventKeyboardSetUnicodeString(up, 1, &u);
                      CGEventPost(kCGHIDEventTap, dn);
                      usleep(8000);
                      CGEventPost(kCGHIDEventTap, up);
                      usleep(8000);
                  }
                  if (dn) CFRelease(dn);
                  if (up) CFRelease(up);
              }
          }

          int main(int argc, char** argv) {
              if (argc < 2) return 0;
              const char* cmd = argv[1];

              if (strcmp(cmd, "daemon") == 0 && argc >= 3) {
                  stream_worker((void*)argv[2]);
                  return 0;
              }
              if (strcmp(cmd, "size") == 0) {
                  CGDirectDisplayID d = CGMainDisplayID();
                  printf("%zu %zu\n", CGDisplayPixelsWide(d), CGDisplayPixelsHigh(d));
                  return 0;
              }
              if (strcmp(cmd, "click") == 0 && argc >= 4) {
                  double x = atof(argv[2]), y = atof(argv[3]);
                  post_mouse(kCGEventMouseMoved, x, y, kCGMouseButtonLeft, 0);
                  usleep(10000);
                  post_mouse(kCGEventLeftMouseDown, x, y, kCGMouseButtonLeft, 1);
                  usleep(25000);
                  post_mouse(kCGEventLeftMouseUp, x, y, kCGMouseButtonLeft, 1);
              } else if (strcmp(cmd, "dblclick") == 0 && argc >= 4) {
                  double x = atof(argv[2]), y = atof(argv[3]);
                  post_mouse(kCGEventMouseMoved, x, y, kCGMouseButtonLeft, 0);
                  usleep(10000);
                  post_mouse(kCGEventLeftMouseDown, x, y, kCGMouseButtonLeft, 1);
                  usleep(20000);
                  post_mouse(kCGEventLeftMouseUp, x, y, kCGMouseButtonLeft, 1);
                  usleep(25000);
                  post_mouse(kCGEventLeftMouseDown, x, y, kCGMouseButtonLeft, 2);
                  usleep(20000);
                  post_mouse(kCGEventLeftMouseUp, x, y, kCGMouseButtonLeft, 2);
              } else if (strcmp(cmd, "rclick") == 0 && argc >= 4) {
                  double x = atof(argv[2]), y = atof(argv[3]);
                  post_mouse(kCGEventMouseMoved, x, y, kCGMouseButtonRight, 0);
                  usleep(10000);
                  post_mouse(kCGEventRightMouseDown, x, y, kCGMouseButtonRight, 1);
                  usleep(25000);
                  post_mouse(kCGEventRightMouseUp, x, y, kCGMouseButtonRight, 1);
              } else if (strcmp(cmd, "drag") == 0 && argc >= 6) {
                  double x1 = atof(argv[2]), y1 = atof(argv[3]), x2 = atof(argv[4]), y2 = atof(argv[5]);
                  post_mouse(kCGEventMouseMoved, x1, y1, kCGMouseButtonLeft, 0);
                  usleep(10000);
                  post_mouse(kCGEventLeftMouseDown, x1, y1, kCGMouseButtonLeft, 1);
                  for (int i = 1; i <= 12; i++) {
                      double cx = x1 + (x2 - x1) * i / 12.0;
                      double cy = y1 + (y2 - y1) * i / 12.0;
                      usleep(8000);
                      post_mouse(kCGEventLeftMouseDragged, cx, cy, kCGMouseButtonLeft, 1);
                  }
                  usleep(10000);
                  post_mouse(kCGEventLeftMouseUp, x2, y2, kCGMouseButtonLeft, 1);
              } else if (strcmp(cmd, "scroll") == 0 && argc >= 5) {
                  double x = atof(argv[2]), y = atof(argv[3]);
                  int dy = atoi(argv[4]);
                  post_mouse(kCGEventMouseMoved, x, y, kCGMouseButtonLeft, 0);
                  CGEventRef sev = CGEventCreateScrollWheelEvent(NULL, kCGScrollEventUnitLine, 1, dy);
                  if (sev) { CGEventPost(kCGHIDEventTap, sev); CFRelease(sev); }
              } else if (strcmp(cmd, "key") == 0 && argc >= 3) {
                  int kc = atoi(argv[2]);
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)kc, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)kc, false);
                  if (dn) { CGEventPost(kCGHIDEventTap, dn); CFRelease(dn); }
                  usleep(15000);
                  if (up) { CGEventPost(kCGHIDEventTap, up); CFRelease(up); }
              } else if (strcmp(cmd, "cmdkey") == 0 && argc >= 3) {
                  int kc = atoi(argv[2]);
                  CGEventRef dn = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)kc, true);
                  CGEventRef up = CGEventCreateKeyboardEvent(NULL, (CGKeyCode)kc, false);
                  if (dn && up) {
                      CGEventSetFlags(dn, kCGEventFlagMaskCommand);
                      CGEventSetFlags(up, kCGEventFlagMaskCommand);
                      CGEventPost(kCGHIDEventTap, dn);
                      usleep(20000);
                      CGEventPost(kCGHIDEventTap, up);
                  }
                  if (dn) CFRelease(dn);
                  if (up) CFRelease(up);
              } else if (strcmp(cmd, "text") == 0 && argc >= 3) {
                  type_utf8(argv[2]);
              }
              return 0;
          }
          EOF

          echo "Компиляция высокоскоростного движка ввода и захвата экрана (CoreGraphics 30 FPS)..."
          clang -O3 -framework ApplicationServices -framework ImageIO -framework CoreServices /tmp/mac_fast.c -o /tmp/mac_fast

