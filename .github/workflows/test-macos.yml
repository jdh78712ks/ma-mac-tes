          </head>
          <body>
          <div class="toolbar">
            <b> Mac M1</b>
            <button class="btn primary" onclick="directPasteFromClipboard()" title="Вставить прямо из буфера обмена вашего ПК (Ctrl+V)">📋 Вставить буфер (Ctrl+V)</button>
