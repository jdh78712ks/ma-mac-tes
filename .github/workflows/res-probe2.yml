name: display probe 2
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: probe
        run: |
          set +e
          echo "=== ${{ matrix.os }} model=$(sysctl -n hw.model) arch=$(uname -m) ==="
          sw_vers
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ANALYTICS=1
          command -v displayplacer >/dev/null 2>&1 || brew install displayplacer >/tmp/br.log 2>&1
          DP=$(command -v displayplacer || echo /opt/homebrew/bin/displayplacer)
          "$DP" list 2>&1 | sed -n '/Resolutions for rotation/,$p' | head -20
          ID=$("$DP" list 2>/dev/null | sed -n 's/^Persistent screen id: //p' | head -1)
          N=$("$DP" list 2>/dev/null | sed -n 's/.*mode \([0-9][0-9]*\): res:1920x1080 .*/\1/p' | head -1)
          echo "id=$ID mode1920=$N"
          echo "--- try mode ---"
          "$DP" "id:$ID mode:$N origin:(0,0) degree:0" 2>&1
          sleep 3
          screencapture -x /tmp/a.png 2>/dev/null
          sips -g pixelWidth -g pixelHeight /tmp/a.png 2>/dev/null
          echo "--- try res scaling:on ---"
          "$DP" "id:$ID res:1920x1080 scaling:on origin:(0,0) degree:0" 2>&1
          sleep 3
          screencapture -x /tmp/b.png 2>/dev/null
          sips -g pixelWidth -g pixelHeight /tmp/b.png 2>/dev/null
          echo "--- after ---"
          "$DP" list 2>&1 | head -12
          echo "=== end ==="
